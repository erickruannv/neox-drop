{% from "partials/macros.html" import icon %}
{#- Palco "Ver em 3D" (viewer3d.js). Vazio até o clique: nenhum 3D é baixado antes disso. -#}
<dialog id="viewer-3d" class="viewer-3d" aria-labelledby="viewer-3d-title">
  <div class="flex items-center justify-between gap-4 px-5 pt-4 sm:px-8 sm:pt-6">
    <p class="min-w-0">
      <span class="block text-xs font-semibold uppercase tracking-wider text-lime">Visualização 3D</span>
      <span id="viewer-3d-title" class="display-type block truncate text-[clamp(1.4rem,3vw,2.25rem)]" data-viewer-title></span>
    </p>
    <button type="button" class="icon-btn shrink-0 bg-white/10 hover:bg-white/20" data-viewer-close aria-label="Fechar visualização 3D">{{ icon("close") }}</button>
  </div>
  <div class="viewer-3d-stage relative mx-3 mt-3 overflow-hidden rounded-2xl sm:mx-8" data-viewer-stage>
    <img src="" alt="" class="absolute inset-0 size-full object-contain p-8 opacity-60" data-viewer-poster>
  </div>
  <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-1 px-5 py-4 text-sm sm:px-8 sm:pb-6">
    <p class="flex items-center gap-2 font-semibold" data-viewer-hint></p>
    <a class="text-xs opacity-70 underline-offset-2 hover:underline" target="_blank" rel="noopener noreferrer" data-viewer-credit></a>
  </div>
  <p class="sr-only" aria-live="polite" data-viewer-status></p>
</dialog>
