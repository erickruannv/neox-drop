[project]
name = "neox-drop"
version = "0.1.0"
description = "Backend NEOX drop V1.1"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pymongo==4.20.0",
    "supabase==2.34.1",
    "upstash-redis==1.9.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
